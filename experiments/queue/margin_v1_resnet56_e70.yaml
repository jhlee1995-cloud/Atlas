# A4b M56 (docs/plans/STAGE2B.md section M56): Stage B only (margin_typeb, frozen at 664bd25) on the existing
# results/atlas_v1_resnet56_e70/dump; pod_atlas.sh --a4b symlinks results/margin_v1_resnet56_e70/dump ->
# ../atlas_v1_resnet56_e70/dump and runs atlas.run --skip-extract. data / hooks / extract are copied from the source
# manifest. Role: accuracy-matched margin if this rung is M11 or in the window.
exp_id: margin_v1_resnet56_e70
stage: atlas
backbone:
  arch: cifar10_resnet56
  weights: /workspace/models/resnet56_s11_e70_chenyaofo.pt
  seed_tag: s11e70
  norm: chenyaofo
data:
  reference:  {dataset: cifar10_train, n: 10000, seed: 0}
  clean_test: {dataset: cifar10, n: 5000}
  panel:      {dataset: cifar10_train, n: 64, seed: 123}
  cifar10c:   {corruptions: all, severities: [1, 3, 5], n_per_set: 2000}
  ood:        [{dataset: cifar100, n: 2000}, {dataset: svhn, n: 2000}]
hooks: {layers: blocks, block_stride: 5, pooling: gap}
extract: {batch: 256, dtype: float16, num_workers: 4}
invariants: [margin_typeb]
cross_layer: ["-layer_cka", "-commit_layer"]     # selects none (an empty list would mean "all"); B1 registers no
                                                 # cross-layer invariant (integration D2); the smoke test checks it
invariant_cfg:
  margin_typeb: {cut: 0.7, cuts: [0.0, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 0.99], min_n: 10}
holdout:
  discovery_corruptions:    [gaussian_noise, shot_noise, defocus_blur, motion_blur, snow, fog,
                             brightness, contrast, pixelate, jpeg_compression]
  confirmation_corruptions: [impulse_noise, glass_blur, zoom_blur, frost, elastic_transform]
  discovery_seeds: [11]
  confirmation_seeds: [1, 2, 12, 13]
outputs: {root: results/margin_v1_resnet56_e70, plots: false}
notes: >
  A4b M56 rebuild. Predictions M56-a..c are in margin_v1_resnet56_s1.yaml notes.
