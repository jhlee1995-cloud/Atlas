# A3 margin/type-b: Stage B only (margin_typeb) on the existing atlas_v1_resnet56_s0hub dump. pod_atlas.sh --a3
# symlinks results/margin_v1_resnet56_s0hub/dump -> ../atlas_v1_resnet56_s0hub/dump and runs atlas.run --skip-extract.
# data / hooks / extract are copied from the source manifest.
# Pre-registration: experiments/queue/margin_v1_resnet20_s1.yaml (same commit).
exp_id: margin_v1_resnet56_s0hub
stage: atlas
backbone:
  arch: cifar10_resnet56
  weights: hub
  seed_tag: s0
  norm: chenyaofo
data:
  reference:  {dataset: cifar10_train, n: 10000, seed: 0}
  clean_test: {dataset: cifar10, n: 5000}
  panel:      {dataset: cifar10_train, n: 64, seed: 123}
  cifar10c:   {corruptions: all, severities: [1, 3, 5], n_per_set: 2000}
  ood:        [{dataset: cifar100, n: 2000}, {dataset: svhn, n: 2000}]
hooks: {layers: blocks, block_stride: 5, pooling: gap}
extract: {batch: 256, dtype: float16, num_workers: 4}
invariants: [margin_typeb]
cross_layer: ["-layer_cka", "-commit_layer"]     # selects none (an empty list would mean "all")
invariant_cfg:
  margin_typeb: {cut: 0.7, cuts: [0.0, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 0.99], min_n: 10}
holdout:
  discovery_corruptions:    [gaussian_noise, shot_noise, defocus_blur, motion_blur, snow, fog,
                             brightness, contrast, pixelate, jpeg_compression]
  confirmation_corruptions: [impulse_noise, glass_blur, zoom_blur, frost, elastic_transform]
  discovery_seeds: [0]            # depth 56 is discovery (hub only), as in atlas_v1_resnet56_s0hub
  confirmation_seeds: [1, 2]      # full-recipe resnet56 seeds, reserved; not trained in this session
outputs: {root: results/margin_v1_resnet56_s0hub, plots: false}
notes: |
  A3 Stage-B rebuild (margin_typeb) of results/atlas_v1_resnet56_s0hub/dump;
  pre-registration in margin_v1_resnet20_s1.yaml (same commit).
  Role: EXPLORATORY E5 (scale): compared with margin_v1_resnet20_s0hub from the same session; legacy 0.905 is INFO only.
  Source dump built by pod_atlas.sh --stage2 in this session (block_stride 5: taps stem, layer1.0, layer1.5, layer1.8, ...,
  layer3.8 == penult). The Stage 2 atlases themselves exclude margin_typeb.
