# Stage 1 (v1): the hub checkpoint re-mapped under the normalization it was trained with (chenyaofo
# training log std 0.2023/0.1994/0.2010). Same inputs as atlas_v0_resnet20_cifar10 (ref seed 0, panel seed 123),
# so compare --same-space v0 -> v1 isolates the input-normalization change.
exp_id: atlas_v1_resnet20_s0hub
stage: atlas
backbone:
  arch: cifar10_resnet20
  weights: hub
  seed_tag: s0
  norm: chenyaofo
data:
  reference:  {dataset: cifar10_train, n: 10000, seed: 0}
  clean_test: {dataset: cifar10, n: 5000}
  panel:      {dataset: cifar10_train, n: 64, seed: 123}
  cifar10c:   {corruptions: all, severities: [1, 3, 5], n_per_set: 2000}
  ood:        [{dataset: cifar100, n: 2000}, {dataset: svhn, n: 2000}]
hooks: {layers: blocks, block_stride: 1, pooling: gap}
extract: {batch: 256, dtype: float16, num_workers: 4}
invariants: all
cross_layer: all
invariant_cfg:
  twonn_id:      {n_ref: 5000, bootstrap: 3}
  hubness:       {n_ref: 5000, k: 10}
  knn_density:   {n_ref: 10000, k: 10, n_query: 3000}
  linear_probes: {n_train: 4000, cv_folds: 5, factors: all}
  commit_layer:  {tau: 0.9}
holdout:
  discovery_corruptions:    [gaussian_noise, shot_noise, defocus_blur, motion_blur, snow, fog,
                             brightness, contrast, pixelate, jpeg_compression]
  confirmation_corruptions: [impulse_noise, glass_blur, zoom_blur, frost, elastic_transform]
  discovery_seeds: [0]
  confirmation_seeds: [1, 2]      # touched once, with invariants + tolerances frozen; seeds 3, 4 reserved
outputs: {root: results/atlas_v1_resnet20_s0hub, plots: true}
notes: >
  Stage 1 (v1). Pre-registered predictions and the decision rule are in atlas_v1_resnet20_s1.yaml notes
  and docs/plans/STAGE1.md, committed together with this manifest before the run.
