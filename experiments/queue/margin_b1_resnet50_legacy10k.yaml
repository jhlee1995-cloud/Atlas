# B1 gate G0-G2: torchvision resnet50 IMAGENET1K_V2 on the Upgraded-Mod ImageNet block (the first val rows in the
# imagenet_extract.py:40-60 loop order, N in [10048, 10111]; legacy transform imagenet_extract.py:26-27). Reference =
# test = that block (in-sample centers, as the legacy); only pm.legacy_imagenet is read, the A3-definition keys of
# this dump are not interpreted. reference.n / clean_test.n are null so atlas/config.py DEFAULTS cannot fill CIFAR
# sizes. Pre-registration: experiments/queue/margin_b1_vitb16.yaml (same commit).
exp_id: margin_b1_resnet50_legacy10k
stage: atlas
n_classes: 1000
backbone:
  arch: tv_resnet50                # torchvision.models.resnet50
  weights: IMAGENET1K_V2           # acc@1 80.858
  seed_tag: tv2
  norm: imagenet
  transform: legacy_imagenet_extract   # Resize(256), CenterCrop(224), ToTensor, Normalize (imagenet_extract.py:26-27)
data:
  imagenet_val:
    repo: benjamin-paine/imagenet-1k-256x256
    revision: 1bd0400450249a7fe90c0aece37d0d03e7ea956a
    files:
      - path: data/validation-00000-of-00002.parquet
        sha256: 399ae54c309fa71f99b6f3c121ad4507ae3103f0205923e6695b6a6bac52c6eb
      - path: data/validation-00001-of-00002.parquet
        sha256: 3c665d47c5057e237be8c15348570466478e4a73b8d4ff913ed319cd8e3f16f7
  reference:  {dataset: imagenet_val, part: legacy_first, n_target: 10000, loop_batch: 64, n: null, seed: 0}
  clean_test: {dataset: imagenet_val, part: legacy_first, n_target: 10000, loop_batch: 64, n: null}
  panel: null
  cifar10c: null
  ood: []
hooks: {layers: stages, block_stride: 1, pooling: gap}          # stem, layer1 .. layer4, penult; only penult is read
extract: {batch: 64, dtype: float32, num_workers: 8, store_logits: true}           # batch 64 as the legacy flush
invariants: [margin_typeb]
cross_layer: ["-layer_cka", "-commit_layer"]     # selects none (an empty list would mean "all")
invariant_cfg:
  margin_typeb: {cut: 0.7, cuts: [0.0, 0.5, 0.6, 0.7, 0.8, 0.9, 0.95, 0.99], min_n: 10, b1: true,
                 strat_bins: 10, strat_min: 5, legacy_imagenet: {cut: 0.5, min_class_n: 3, draws: 200, seed: 0,
                                                                  layers: [penult]}}
holdout:
  discovery_seeds: [resnet50_tv2, resnet20_hub, resnet56_hub]      # gate, contrast, CIFAR context: may be read
  confirmation_seeds: [vit_b_16_tv1, deit_base_patch16_224_fb]     # first and only margin touch, after gate G
  reserve_confirmation: [vit_base_patch16_224.augreg_in1k]         # for any redesign found on resnet50
outputs: {root: results/margin_b1_resnet50_legacy10k, plots: false}
notes: |
  Pre-registration: experiments/queue/margin_b1_vitb16.yaml notes (same commit P); docs/plans/B1_VIT_MARGIN.md.
  Role: gate G0 (meta.n_test in [10048, 10111], lg.acc, lg.valley_sep_legacy; decode failures recorded, not
  refused: the legacy loop skipped them), G1 (lg.dir_auc_margin_full vs 0.800), G2 (legacy order margin > cluster >
  energy; cluster vs 0.636); B1-acc (INFO). Discovery material. Legacy anchors: MASTER_SUMMARY.md:193-197,
  docs/history/session_experiments_README.md:19-20.
