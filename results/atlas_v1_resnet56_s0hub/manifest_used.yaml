exp_id: atlas_v1_resnet56_s0hub
stage: atlas
backbone:
  arch: cifar10_resnet56
  weights: hub
  seed_tag: s0
  norm: chenyaofo
data:
  reference:
    dataset: cifar10_train
    n: 10000
    seed: 0
  clean_test:
    dataset: cifar10
    n: 5000
  panel:
    dataset: cifar10_train
    n: 64
    seed: 123
  cifar10c:
    corruptions: all
    severities:
    - 1
    - 3
    - 5
    n_per_set: 2000
  ood:
  - dataset: cifar100
    n: 2000
  - dataset: svhn
    n: 2000
hooks:
  layers: blocks
  block_stride: 5
  pooling: gap
extract:
  batch: 256
  dtype: float16
  num_workers: 4
invariants:
- -margin_typeb
cross_layer: all
invariant_cfg:
  twonn_id:
    n_ref: 5000
    bootstrap: 3
  hubness:
    n_ref: 5000
    k: 10
  knn_density:
    n_ref: 10000
    k: 10
    n_query: 3000
  linear_probes:
    n_train: 4000
    cv_folds: 5
    factors: all
  commit_layer:
    tau: 0.9
probes:
  n_train: 4000
  cv_folds: 5
  factors: all
holdout:
  discovery_corruptions:
  - gaussian_noise
  - shot_noise
  - defocus_blur
  - motion_blur
  - snow
  - fog
  - brightness
  - contrast
  - pixelate
  - jpeg_compression
  confirmation_corruptions:
  - impulse_noise
  - glass_blur
  - zoom_blur
  - frost
  - elastic_transform
  discovery_seeds:
  - 0
  confirmation_seeds:
  - 1
  - 2
outputs:
  root: results/atlas_v1_resnet56_s0hub
  plots: true
notes: "Stage 2 (A4) pre-registration, committed and pushed before the run. Design,\
  \ attribution rule and per-row\nscale labels: docs/plans/STAGE2.md. A = resnet20\
  \ re-measured in this session at this commit (rule 6):\natlas_v1_resnet20_{s0hub,s1,s2}_st2\
  \ = the band B20, exactly these three (s3 and s4 never enter A4).\nB = this run.\
  \ Control = accuracy ladder atlas_v1_resnet56_e{10,20,40} (hub recipe, seed 11,\
  \ full cosine over\nE epochs, last epoch; E are guesses meant to bracket 0.9259).\
  \ Null = atlas_v1_resnet56_rand. Fine profile =\natlas_v1_resnet56_s0hub_b1 (never\
  \ compared with resnet20). Aligned names = resnet56 taps renamed to resnet20\nnames\
  \ by position (compare pairs by position; critic --align position); layer3.8 ==\
  \ penult is counted once.\nBand sides: over B20 (atlas.json values) min, max and\
  \ w = max - min; \"outside on the high side\" = above\nmax + w, \"outside on the\
  \ low side\" = below min - w, \"inside\" = within [min - w, max + w]. Stage 1 values\
  \ in\nparentheses are expected values, not thresholds (rule 6: thresholds come from\
  \ the same-session band).\n[ACC] = expected to move with accuracy: the r20-r56 difference\
  \ is labelled DEPTH / NOT-DEPTH / UNRESOLVED by\nthe STAGE2 attribution rule and\
  \ never read as a depth effect by itself.\nOrdering: A4 results are evaluated only\
  \ after the Stage 1b decision is committed (docs/plans/STAGE1.md\namendment 2 item\
  \ 7); under a Stage 1b KILL or INVALID every A4 result is INFO and nothing is promoted.\n\
  Holdout: only the seed/depth axis is a clean holdout for R56-4 (decod pools include\
  \ the confirmation\ncorruptions, atlas/invariants/decodability.py:30); confirmation-corruption\
  \ values seen here seed no new claims.\nPaths: results/atlas_v1_resnet56_s0hub/compare_vs_atlas_v1_resnet20_s0hub_st2/deformation.json;\n\
  results/critic_v1_scale_r20hub_r56hub/critic.json; band pairs results/critic_v1_resnet20_st2_band/critic.json;\n\
  accuracies results/norm_check_resnet56/norm_check.json chenyaofo.acc_10k (hub) and\n\
  results/train_resnet56_e{10,20,40}/train.json final_test_acc_10k (rungs).\n\nR56-0\
  \ gates (any failure = INVALID, no verdicts)\na  in atlas_v1_resnet56_{s0hub,e10,e20,e40,rand}\
