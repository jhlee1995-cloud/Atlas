exp_id: margin_v1_resnet20_s3_st3
stage: atlas
backbone:
  arch: cifar10_resnet20
  weights: /workspace/models/resnet20_s3_chenyaofo.pt
  seed_tag: s3
  norm: chenyaofo
data:
  reference:
    dataset: cifar10_train
    n: 10000
    seed: 0
  clean_test:
    dataset: cifar10
    n: 5000
  panel:
    dataset: cifar10_train
    n: 64
    seed: 123
  cifar10c:
    corruptions: all
    severities:
    - 1
    - 3
    - 5
    n_per_set: 2000
  ood:
  - dataset: cifar100
    n: 2000
  - dataset: svhn
    n: 2000
hooks:
  layers: blocks
  block_stride: 1
  pooling: gap
extract:
  batch: 256
  dtype: float16
  num_workers: 4
invariants:
- margin_typeb
cross_layer:
- -layer_cka
- -commit_layer
invariant_cfg:
  margin_typeb:
    cut: 0.7
    cuts:
    - 0.0
    - 0.5
    - 0.6
    - 0.7
    - 0.8
    - 0.9
    - 0.95
    - 0.99
    min_n: 10
  linear_probes:
    n_train: 4000
    cv_folds: 5
    factors: all
probes:
  n_train: 4000
  cv_folds: 5
  factors: all
holdout:
  discovery_corruptions:
  - gaussian_noise
  - shot_noise
  - defocus_blur
  - motion_blur
  - snow
  - fog
  - brightness
  - contrast
  - pixelate
  - jpeg_compression
  confirmation_corruptions:
  - impulse_noise
  - glass_blur
  - zoom_blur
  - frost
  - elastic_transform
  discovery_seeds:
  - 0
  confirmation_seeds:
  - 3
  - 4
outputs:
  root: results/margin_v1_resnet20_s3_st3
  plots: false
notes: 'A4b M56 rebuild. Predictions M56-a..c are in margin_v1_resnet56_s1.yaml notes.

  '
