exp_id: atlas_v1_resnet56_e40
stage: atlas
backbone:
  arch: cifar10_resnet56
  weights: /workspace/models/resnet56_s11_e40_chenyaofo.pt
  seed_tag: s11e40
  norm: chenyaofo
data:
  reference:
    dataset: cifar10_train
    n: 10000
    seed: 0
  clean_test:
    dataset: cifar10
    n: 5000
  panel:
    dataset: cifar10_train
    n: 64
    seed: 123
  cifar10c:
    corruptions: all
    severities:
    - 1
    - 3
    - 5
    n_per_set: 2000
  ood:
  - dataset: cifar100
    n: 2000
  - dataset: svhn
    n: 2000
hooks:
  layers: blocks
  block_stride: 5
  pooling: gap
extract:
  batch: 256
  dtype: float16
  num_workers: 4
invariants:
- -margin_typeb
cross_layer: all
invariant_cfg:
  twonn_id:
    n_ref: 5000
    bootstrap: 3
  hubness:
    n_ref: 5000
    k: 10
  knn_density:
    n_ref: 10000
    k: 10
    n_query: 3000
  linear_probes:
    n_train: 4000
    cv_folds: 5
    factors: all
  commit_layer:
    tau: 0.9
probes:
  n_train: 4000
  cv_folds: 5
  factors: all
holdout:
  discovery_corruptions:
  - gaussian_noise
  - shot_noise
  - defocus_blur
  - motion_blur
  - snow
  - fog
  - brightness
  - contrast
  - pixelate
  - jpeg_compression
  confirmation_corruptions:
  - impulse_noise
  - glass_blur
  - zoom_blur
  - frost
  - elastic_transform
  discovery_seeds:
  - 11
  confirmation_seeds:
  - 1
  - 2
outputs:
  root: results/atlas_v1_resnet56_e40
  plots: true
notes: 'Stage 2 (A4) control. Predictions R56-0 and R56-9 are in atlas_v1_resnet56_s0hub.yaml
  notes.

  '
