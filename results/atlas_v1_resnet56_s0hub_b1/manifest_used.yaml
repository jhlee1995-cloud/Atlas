exp_id: atlas_v1_resnet56_s0hub_b1
stage: atlas
backbone:
  arch: cifar10_resnet56
  weights: hub
  seed_tag: s0
  norm: chenyaofo
data:
  reference:
    dataset: cifar10_train
    n: 10000
    seed: 0
  clean_test:
    dataset: cifar10
    n: 5000
  panel:
    dataset: cifar10_train
    n: 64
    seed: 123
  cifar10c:
    corruptions: all
    severities:
    - 1
    - 3
    - 5
    n_per_set: 2000
  ood:
  - dataset: cifar100
    n: 2000
  - dataset: svhn
    n: 2000
hooks:
  layers: blocks
  block_stride: 1
  pooling: gap
extract:
  batch: 256
  dtype: float16
  num_workers: 4
invariants:
- -margin_typeb
cross_layer: all
invariant_cfg:
  twonn_id:
    n_ref: 5000
    bootstrap: 3
  hubness:
    n_ref: 5000
    k: 10
  knn_density:
    n_ref: 10000
    k: 10
    n_query: 3000
  linear_probes:
    n_train: 4000
    cv_folds: 5
    factors: all
  commit_layer:
    tau: 0.9
probes:
  n_train: 4000
  cv_folds: 5
  factors: all
holdout:
  discovery_corruptions:
  - gaussian_noise
  - shot_noise
  - defocus_blur
  - motion_blur
  - snow
  - fog
  - brightness
  - contrast
  - pixelate
  - jpeg_compression
  confirmation_corruptions:
  - impulse_noise
  - glass_blur
  - zoom_blur
  - frost
  - elastic_transform
  discovery_seeds:
  - 0
  confirmation_seeds:
  - 1
  - 2
outputs:
  root: results/atlas_v1_resnet56_s0hub_b1
  plots: true
notes: "Exploratory (no promotion); predictions R56-5c and F1-F4. Same weights and\
  \ inputs as atlas_v1_resnet56_s0hub.\nF1 integrity: per-layer twonn_id.id and class_centers.sep_ratio\
  \ at the 11 taps shared with\n   atlas_v1_resnet56_s0hub agree within 0.01 (same\
  \ weights and inputs; the build's per-layer rng is seeded the\n   same way for every\
  \ layer).\nF2 log10(neural_collapse.nc1) vs block index (layer3.8 alias dropped)\
  \ Pearson <= -0.95 (Stage 1 r20 hub / s1 /\n   s2: -0.982 / -0.977 / -0.976 over\
  \ 10 distinct taps, derived).\nF3 recorded, no verdict: share of the peak -> penult\
  \ ID drop that falls in layer3.7 -> layer3.8.\nF4 the class commit block (first\
  \ block whose cross_layer.commit_layer.per_factor.class.profile value reaches\n\
  \   tau x best) lies in stage 3 at every tau in {0.85, 0.90, 0.95}; tau 0.80 recorded\
  \ (rule 5).\nR56-5c: cross_layer.layer_cka.biggest_reorganization is one of layer3.3->layer3.4\
  \ .. layer3.7->layer3.8.\n"
